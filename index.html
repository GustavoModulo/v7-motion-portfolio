<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V7 Motion | Audiovisual Automotivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; background: black; }
    .btn-action { transition: all 0.3s ease; letter-spacing: 0.2em; font-weight: 900; }
    .btn-action:hover { transform: scale(1.05); }
    .bg-blur-fix { filter: blur(8px); transform: scale(1.05); opacity: 0.5; background-size: cover; background-position: center; }
    .btn-v7 { position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
    .btn-v7::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
    .btn-v7:hover::before { left: 100%; }
  </style>
</head>
<body class="text-white overflow-x-hidden selection:bg-red-600">

  <nav class="fixed top-0 w-full z-40 px-8 py-6 bg-gradient-to-b from-black via-black/80 to-transparent backdrop-blur-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-2xl font-black uppercase tracking-tighter">V7 <span class="text-red-600">Motion</span></h1>
      
      <div class="hidden md:flex gap-8 text-[10px] font-black uppercase tracking-[0.2em]">
        <a href="#inicio" class="hover:text-red-500 transition-colors">Início</a>
        <a href="#projetos-wrapper" class="hover:text-red-500 transition-colors">Portfólio</a>
        <a href="#contato" class="hover:text-red-500 transition-colors">Contato</a>
      </div>

      <div class="flex items-center gap-5">
        <a href="https://instagram.com/v7motion" target="_blank" class="text-zinc-400 hover:text-red-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <a href="https://www.youtube.com/@V7.motion" target="_blank" class="text-zinc-400 hover:text-red-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
        </a>
      </div>
    </div>
  </nav>

  <header id="inicio" class="relative w-full h-screen flex flex-col items-center justify-center">
    <h1 class="text-7xl md:text-9xl font-black uppercase tracking-tighter mb-4">V7 <span class="text-red-600">Motion</span></h1>
    <p class="text-zinc-500 font-mono text-[10px] tracking-[0.5em] uppercase">Cinematics & Photography</p>
  </header>

  <main id="projetos-wrapper" class="w-full pt-20">
    <div class="flex justify-center gap-6 mb-16 px-6">
      <button id="btn-tab-real" onclick="mudarAba('real')" class="px-10 py-4 border-2 font-black text-xs uppercase transition-all cursor-pointer">Vida Real</button>
      <button id="btn-tab-virtual" onclick="mudarAba('virtual')" class="px-10 py-4 border-2 font-black text-xs uppercase transition-all cursor-pointer">Simulador</button>
    </div>
    <div id="projetos-container" class="w-full flex flex-col"></div>
  </main>

  <section id="contato" class="w-full py-32 bg-zinc-950 border-t border-zinc-900 relative">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/10 via-black to-black opacity-50"></div>
    <div class="relative max-w-3xl mx-auto px-6 z-10">
      <div class="text-center mb-12">
        <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter mb-4">Faça um <span class="text-red-600">Orçamento</span></h2>
        <p class="text-zinc-400 font-light text-sm md:text-base">Fale diretamente comigo pelo WhatsApp para fecharmos seu projeto.</p>
      </div>
      
      <form id="form-whatsapp" class="flex flex-col gap-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <input type="text" id="wa-nome" placeholder="Seu Nome" required class="bg-black border border-zinc-800 p-4 rounded-sm focus:border-red-600 outline-none text-white transition-all">
          <select id="wa-servico" required class="bg-black border border-zinc-800 p-4 rounded-sm focus:border-red-600 outline-none text-zinc-400">
            <option value="" disabled selected>Tipo de Serviço</option>
            <option value="Cobertura de Evento">Cobertura de Evento</option>
            <option value="Ensaio Privado">Ensaio Privado</option>
            <option value="Simulador Cinematic">Simulador Cinematic</option>
          </select>
        </div>
        <textarea id="wa-mensagem" placeholder="Fale um pouco sobre o projeto..." rows="4" required class="bg-black border border-zinc-800 p-4 rounded-sm focus:border-red-600 outline-none text-white"></textarea>
        <button type="submit" class="btn-v7 w-full py-5 bg-red-600 hover:bg-red-700 text-white font-black text-xs uppercase tracking-[0.2em] rounded-sm cursor-pointer">
          Enviar Mensagem no WhatsApp
        </button>
      </form>
    </div>
  </section>

  <footer class="bg-black py-12 border-t border-zinc-900 text-center">
    <p class="text-[10px] font-mono text-zinc-600 uppercase tracking-widest">© 2026 V7 Motion | Audiovisual Automotivo</p>
  </footer>

  <div id="modal-galeria" class="fixed inset-0 z-50 hidden bg-black/98 flex-col items-center justify-center backdrop-blur-xl">
    <button onclick="fecharModal()" class="absolute top-8 right-8 text-white font-black uppercase text-xs z-50 p-4 cursor-pointer">Fechar [X]</button>
    <div class="relative w-full max-w-6xl h-[80vh] flex items-center justify-center px-4">
      <button onclick="mudarFoto(-1)" id="btn-prev" class="absolute left-4 text-white text-6xl font-light z-50 cursor-pointer">&lsaquo;</button>
      <img id="img-modal" src="" class="max-w-full max-h-full object-contain shadow-2xl border border-white/10">
      <button onclick="mudarFoto(1)" id="btn-next" class="absolute right-4 text-white text-6xl font-light z-50 cursor-pointer">&rsaquo;</button>
    </div>
    <div id="contador-fotos" class="absolute bottom-10 text-zinc-500 font-mono text-[10px] tracking-widest uppercase"></div>
  </div>

  <script type="module">
    const SUPABASE_URL = 'https://gwikdmlmjogxvntdezck.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aWtkbWxtam9neHZudGRlemNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNTkxNjMsImV4cCI6MjA5MzgzNTE2M30.cFnbIMMHJm9tOmqJm3ugbGe8IE4eS6u2aD5zTSaEoUE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let projetosGlobais = [];
    let abaAtual = 'real';
    let fotosModal = [];
    let indexFoto = 0;

    async function carregarProjetos() {
      const { data, error } = await _supabase.from('projetos').select('*').order('data', { ascending: false });
      if (error) return;
      projetosGlobais = data;
      renderizarProjetos();
      atualizarBotoes();
    }

    window.mudarAba = (aba) => { abaAtual = aba; atualizarBotoes(); renderizarProjetos(); };

    function renderizarProjetos() {
      const container = document.getElementById('projetos-container');
      const filtrados = projetosGlobais.filter(p => abaAtual === 'real' ? p.cor_destaque === 'red' : p.cor_destaque === 'cyan');

      container.innerHTML = filtrados.map(p => {
        const urlFinalMidia = p.video_fundo || "";
        const isVideo = p.tipo === 'video';
        
        const fotoFundo = p.fotos && p.fotos.length > 0 ? p.fotos[0] : urlFinalMidia;
        
        const labelBotao = isVideo ? 'ASSISTIR VÍDEO' : `VER FOTOS (${p.fotos?.length || 0})`;
        const acaoBotao = isVideo ? `window.open('${urlFinalMidia}')` : `abrirModal(${p.id})`;
        const corBtn = p.cor_destaque === 'red' ? 'bg-red-600' : 'bg-cyan-500';

        return `
          <section class="relative w-full h-screen flex flex-col justify-center px-8 md:px-32 overflow-hidden border-b border-white/5 bg-black">
            <div class="absolute inset-0 bg-blur-fix" style="background-image: url('${fotoFundo}')"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-black via-black/40 to-transparent"></div>
            <div class="relative z-10 max-w-2xl">
              <p class="font-mono text-[10px] tracking-[0.4em] uppercase mb-4 ${p.cor_destaque === 'red' ? 'text-red-500' : 'text-cyan-400'}">${p.categoria}</p>
              <h2 class="text-6xl md:text-8xl font-black uppercase tracking-tighter mb-6 leading-none">${p.titulo}</h2>
              <p class="text-zinc-400 text-lg mb-8 font-light leading-relaxed">${p.descricao}</p>
              <button onclick="${acaoBotao}" class="btn-action px-12 py-4 ${corBtn} text-white text-[11px] rounded-sm shadow-xl cursor-pointer">${labelBotao}</button>
            </div>
          </section>
        `;
      }).join('');
    }

    function atualizarBotoes() {
      const red = "border-red-600 text-red-600 bg-red-600/10 shadow-[0_0_20px_rgba(220,38,38,0.2)]";
      const cyan = "border-cyan-500 text-cyan-500 bg-cyan-500/10 shadow-[0_0_20px_rgba(6,182,212,0.2)]";
      const off = "border-zinc-800 text-zinc-600";
      document.getElementById('btn-tab-real').className = `px-10 py-4 border-2 font-black text-xs uppercase transition-all cursor-pointer ${abaAtual === 'real' ? red : off}`;
      document.getElementById('btn-tab-virtual').className = `px-10 py-4 border-2 font-black text-xs uppercase transition-all cursor-pointer ${abaAtual === 'virtual' ? cyan : off}`;
    }

    window.abrirModal = (id) => {
      const p = projetosGlobais.find(x => x.id === id);
      if (!p || !p.fotos) return;
      fotosModal = p.fotos;
      indexFoto = 0;
      atualizarModal();
      document.getElementById('modal-galeria').classList.replace('hidden', 'flex');
      document.body.style.overflow = 'hidden';
    };

    window.fecharModal = () => {
      document.getElementById('modal-galeria').classList.replace('flex', 'hidden');
      document.body.style.overflow = 'auto';
    };

    window.mudarFoto = (dir) => {
      indexFoto = (indexFoto + dir + fotosModal.length) % fotosModal.length;
      atualizarModal();
    };

    function atualizarModal() {
      document.getElementById('img-modal').src = fotosModal[indexFoto];
      document.getElementById('contador-fotos').innerText = `${indexFoto + 1} / ${fotosModal.length}`;
    }

    document.getElementById('form-whatsapp').addEventListener('submit', function(e) {
      e.preventDefault();
      const nome = document.getElementById('wa-nome').value;
      const servico = document.getElementById('wa-servico').value;
      const mensagem = document.getElementById('wa-mensagem').value;
      const textoBase = `Olá V7 Motion!\nMeu nome é ${nome}.\n\nInteresse: ${servico}\n\nDetalhes:\n${mensagem}`;
      const numeroWhatsApp = '5519984400625'; 
      window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(textoBase)}`, '_blank');
      this.reset();
    });

    carregarProjetos();
  </script>
</body>
</html>
