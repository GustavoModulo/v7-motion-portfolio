<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="V7 Motion | Portfólio de audiovisual automotivo. Especialista em filmagens de drift real e cinematics de alto impacto no simulador.">
  <title>V7 Motion | Audiovisual Automotivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans antialiased overflow-x-hidden selection:bg-red-600 selection:text-white">

  <nav class="fixed top-0 w-full z-40 px-8 py-6 bg-gradient-to-b from-black/90 to-transparent backdrop-blur-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="#inicio" class="flex items-center hover:opacity-80 transition-opacity">
        <h1 class="text-2xl font-black uppercase tracking-tighter text-white">V7 <span class="text-red-600">Motion</span></h1>
      </a>
      <div class="hidden md:flex gap-10 text-xs font-bold tracking-[0.2em] uppercase">
        <a href="#sobre" class="hover:text-cyan-400 transition-colors">Sobre</a>
        <a href="#projetos-wrapper" class="hover:text-red-500 transition-colors">Portfólio</a>
        <a href="#contato" class="hover:text-gray-400 transition-colors">Contato</a>
      </div>
      <div class="flex items-center gap-5">
        <a href="https://instagram.com/v7motion" target="_blank" class="hover:text-red-600 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <a href="https://www.youtube.com/@V7.motion" target="_blank" class="hover:text-red-600 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.13 1 12 1 12s0 3.87.54 5.58a2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.87 23 12 23 12s0-3.87-.54-5.58z"></path><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"></polygon></svg>
        </a>
      </div>
    </div>
  </nav>

  <header id="inicio" class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden bg-black">
    <div class="relative text-center flex flex-col items-center z-20">
      <h1 class="flex items-center justify-center gap-4 text-6xl md:text-8xl font-black uppercase tracking-tighter mb-2">
        <span class="text-white">V7</span> <span class="text-red-600">Motion</span>
      </h1>
      <h2 class="text-2xl md:text-4xl font-light italic text-gray-200 tracking-widest mb-6">Audiovisual</h2>
      <div class="flex items-center gap-4 text-xs font-mono tracking-[0.3em] uppercase text-gray-300 bg-black/50 px-6 py-2 rounded-full border border-white/10 backdrop-blur-md">
        <span class="text-red-500">Real</span> • <span>Cinematics</span> • <span class="text-cyan-400">Virtual</span>
      </div>
    </div>
  </header>

  <main id="projetos-wrapper" class="w-full pt-24 min-h-screen bg-black relative z-20 border-t border-zinc-900">
    <div class="flex flex-wrap justify-center gap-4 mb-8 px-6">
      <button id="btn-tab-real" onclick="mudarAba('real')" class="px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer">Vida Real</button>
      <button id="btn-tab-virtual" onclick="mudarAba('virtual')" class="px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer">Simulador</button>
    </div>

    <div class="flex flex-wrap justify-center gap-4 mb-16 px-6">
      <button id="btn-filtro-video" onclick="mudarFiltro('video')" class="px-6 py-2 font-bold uppercase text-xs rounded-full cursor-pointer">Vídeos</button>
      <button id="btn-filtro-galeria" onclick="mudarFiltro('galeria')" class="px-6 py-2 font-bold uppercase text-xs rounded-full cursor-pointer">Fotos</button>
    </div>

    <div id="projetos-container" class="w-full flex flex-col">
      </div>
  </main>

  <footer class="bg-black py-12 border-t border-zinc-900 flex flex-col md:flex-row items-center justify-between px-8 md:px-24">
    <p class="text-xs font-mono text-zinc-600 uppercase tracking-widest">© 2026 V7 Motion.</p>
    <div class="flex items-center gap-4 text-xs font-mono text-zinc-600 uppercase tracking-widest">
      <span>Code by <span class="text-zinc-400">Gustavo Modulo</span></span>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1UCRutMhoZq740v_xwiCOdK9DS7oJ7Q0",
      authDomain: "v7-motion.firebaseapp.com",
      projectId: "v7-motion",
      storageBucket: "v7-motion.firebasestorage.app",
      messagingSenderId: "828939613614",
      appId: "1:828939613614:web:3f72ab60e3eae198c5043f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let projetosGlobais = [];
    let abaAtual = 'real'; 
    let filtroAtual = 'video'; 

    window.mudarAba = (aba) => {
      abaAtual = aba;
      filtroAtual = 'video'; 
      atualizarBotoes();
      renderizarProjetos();
    };

    window.mudarFiltro = (filtro) => {
      filtroAtual = filtro;
      atualizarBotoes();
      renderizarProjetos();
    };

    function atualizarBotoes() {
      const btnReal = document.getElementById('btn-tab-real');
      const btnVirtual = document.getElementById('btn-tab-virtual');
      const activeClass = "border-red-500 text-red-500 bg-red-500/10 shadow-[0_0_15px_rgba(239,68,68,0.3)]";
      const activeClassCyan = "border-cyan-400 text-cyan-400 bg-cyan-400/10 shadow-[0_0_15px_rgba(34,211,238,0.3)]";
      const inactiveClass = "border-zinc-800 text-zinc-500 hover:text-white hover:border-zinc-600";

      if (abaAtual === 'real') {
        btnReal.className = `px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer ${activeClass}`;
        btnVirtual.className = `px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer ${inactiveClass}`;
      } else {
        btnReal.className = `px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer ${inactiveClass}`;
        btnVirtual.className = `px-8 py-4 font-mono text-sm uppercase border transition-all cursor-pointer ${activeClassCyan}`;
      }

      const btnVideo = document.getElementById('btn-filtro-video');
      const btnGaleria = document.getElementById('btn-filtro-galeria');
      const filterActive = "bg-white text-black";
      const filterInactive = "bg-transparent border border-zinc-700 text-zinc-500 hover:text-white";

      btnVideo.className = `px-6 py-2 font-bold uppercase text-xs rounded-full cursor-pointer transition-colors ${filtroAtual === 'video' ? filterActive : filterInactive}`;
      btnGaleria.className = `px-6 py-2 font-bold uppercase text-xs rounded-full cursor-pointer transition-colors ${filtroAtual === 'galeria' ? filterActive : filterInactive}`;
    }

    async function carregarProjetos() {
      try {
        const q = query(collection(db, "projetos"), orderBy("data", "desc"));
        const querySnapshot = await getDocs(q);
        
        projetosGlobais = [];
        querySnapshot.forEach((doc) => {
          projetosGlobais.push({ id: doc.id, ...doc.data() });
        });
        
        atualizarBotoes();
        renderizarProjetos();
      } catch (e) {
        console.error("Erro ao puxar dados do Firebase:", e);
        document.getElementById('projetos-container').innerHTML = '<p class="text-center py-20 text-red-500">Erro de conexão com o banco de dados.</p>';
      }
    }

    function renderizarProjetos() {
      const container = document.getElementById('projetos-container');
      
      const filtrados = projetosGlobais.filter(p => {
        const isReal = p.cor_destaque === 'red';
        if (abaAtual === 'real' && !isReal) return false;
        if (abaAtual === 'virtual' && isReal) return false;
        return p.tipo === filtroAtual;
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<p class="text-center py-20 text-gray-500 font-mono text-sm uppercase tracking-widest">Nenhum projeto encontrado nesta categoria.</p>';
        return;
      }

      container.innerHTML = filtrados.map((p, index) => {
        const ehPar = index % 2 === 0;
        const isVideo = p.video_fundo && (p.video_fundo.includes('.mp4') || p.video_fundo.includes('video'));
        
        let fundoHTML = '';
        if (p.video_fundo) {
            fundoHTML = isVideo 
            ? `<video loop muted autoplay playsinline class="absolute inset-0 w-full h-full object-cover opacity-40 z-0"><source src="${p.video_fundo}" type="video/mp4"></video>`
            : `<div class="absolute inset-0 bg-cover bg-center opacity-40 z-0" style="background-image: url('${p.video_fundo}')"></div>`;
        }

        return `
          <section class="relative w-full h-screen flex flex-col justify-center ${ehPar ? 'items-start text-left' : 'items-end text-right'} px-8 md:px-24 overflow-hidden bg-black border-b border-zinc-900">
            ${fundoHTML}
            <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/80 to-black z-1"></div>
            
            <div class="relative z-10 max-w-2xl">
              <p class="font-mono text-xs tracking-widest uppercase mb-4 ${p.cor_destaque === 'red' ? 'text-red-500' : 'text-cyan-400'} drop-shadow-md">${p.categoria}</p>
              <h2 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-6 drop-shadow-lg">${p.titulo}</h2>
              <p class="text-gray-300 text-lg mb-8 drop-shadow-md leading-relaxed">${p.descricao}</p>
              ${p.tipo === 'video' 
                ? `<a href="${p.video_fundo}" target="_blank" class="px-8 py-4 bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white hover:text-black transition-all uppercase font-bold text-sm tracking-widest inline-block cursor-pointer">Ver Conteúdo</a>`
                : `<a href="${p.video_fundo}" target="_blank" class="px-8 py-4 bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white hover:text-black transition-all uppercase font-bold text-sm tracking-widest inline-block cursor-pointer">Ver Foto Principal</a>`}
            </div>
          </section>
        `;
      }).join('');
    }

    carregarProjetos();
  </script>
</body>
</html>
